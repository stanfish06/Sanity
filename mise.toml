[tools]
uv = "latest"
lefthook = "latest"

[settings]
python.uv_venv_auto = true
# uv owns python via .python-version; stop mise from building it with pyenv
idiomatic_version_file_enable_tools = []

[tasks.build-cli]
dir = "{{config_root}}/src"
run = "make Sanity"

[tasks.test-cli]
dir = "{{config_root}}/tests"
run = "uv run python compare.py"

[tasks.sync]
run = "uv sync --all-groups"

[tasks.build]
run = "uv sync --all-groups --reinstall-package sanity-py"

[tasks.bump]
run = [
    "lefthook run pre-bump",
    "uv version --bump patch",
    "git add uv.lock pyproject.toml",
    'git commit -m "new tag"',
    "git tag v$(uv version --short)",
    "git push --tags",
    "git push",
]

[tasks.docs]
run = "uv run --no-sync sphinx-build -W --keep-going docs docs/_build/html"

[tasks.test]
depends = ["build-cli"]
run = "uv run --no-sync pytest"

[tasks.format]
run = [
    "pyproject-fmt pyproject.toml || true",
    "uv run ruff format",
    "uv run ruff check --fix",
]
