[tools]
uv = "latest"
lefthook = "latest"

[settings]
python.uv_venv_auto = true

[tasks.build-cli]
dir = "{{config_root}}/src"
run = "make Sanity"

[tasks.test-cli]
dir = "{{config_root}}/tests"
run = "uv run python compare.py"

[tasks.sync]
run = "uv sync --all-groups"

[tasks.format]
run = [
    "pyproject-fmt pyproject.toml || true",
    "uv run ruff format",
    "uv run ruff check --fix",
]
