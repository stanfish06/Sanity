[build-system]
build-backend = "scikit_build_core.build"
requires = [ "cython>=3.1", "numpy>=2", "scikit-build-core>=0.11" ]

[project]
name = "sanity-py"
version = "0.1.3"
description = "Python bindings for Sanity (SAmpling-Noise-corrected Inference of Transcription ActivitY)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [ "LICENSE" ]
authors = [
  { name = "Zhiyuan(Stan) Yu", email = "zyyu@umich.edu" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "anndata>=0.10",
  # numba 0.63+ / llvmlite 0.46+ ship no Intel-mac wheels
  "numba>=0.60,<0.63; sys_platform=='darwin' and platform_machine=='x86_64'",
  "numba>=0.60; sys_platform!='darwin' or platform_machine!='x86_64'",
  "numpy>=1.26",
  "scipy>=1.13",
]

[dependency-groups]
dev = [
  "cython>=3.1",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
  "scikit-build-core>=0.11",
  "ty>=0.0.89",
]
docs = [
  "furo>=2025.12.19",
  "sphinx>=9.0.4",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
wheel.py-api = "cp311"
wheel.packages = [ "src/pysanity" ]
wheel.exclude = [ "pysanity/tests", "pysanity/*.cpp", "pysanity/*.h", "pysanity/*.pyx", "pysanity/.gitignore" ]
# upstream-only material; the extension needs src/, CMakeLists.txt and LICENSE
sdist.exclude = [
  "tests",
  "reproducibility",
  "scripts",
  "bin",
  "Dockerfile",
  "variable_rename_proposal.md",
  "docs/_build"
]

[tool.uv]
package = true
cache-keys = [ { file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "src/**/*.{cpp,cc,h,hpp,pyx}" } ]

[tool.cibuildwheel]
# abi3 wheel: one CPython build per platform covers 3.11+
build = "cp311-*"
skip = "*-musllinux_*"
build-frontend = "build[uv]"
test-requires = [ "pytest" ]
# CLI parity tests skip without bin/Sanity; the AnnData tests need the upstream count table
test-sources = [ "src/pysanity/tests", "tests/count_table.tsv" ]
test-command = "pytest -q src/pysanity/tests"
linux.before-all = "dnf install -y zlib-devel || yum install -y zlib-devel"
windows.archs = [ "AMD64" ]
# static zlib with the dynamic CRT, so delvewheel only bundles vcomp140.dll
windows.before-all = "vcpkg install zlib:x64-windows-static-md"
# use vcpkg's toolchain so find_package(ZLIB) resolves the static lib name (zs.lib)
# stop lingering MSBuild nodes from locking the temp build dir during cleanup
windows.environment = { SKBUILD_CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake;-DVCPKG_TARGET_TRIPLET=x64-windows-static-md", MSBUILDDISABLENODEREUSE = "1" }
windows.repair-wheel-command = "uvx delvewheel repair -w {dest_dir} {wheel}"

[tool.ruff]
# dont format upstream python
extend-exclude = [ "*.md", "reproducibility/*", "scripts/*", "tests/*" ]
force-exclude = true
format.indent-style = "space"
format.quote-style = "double"
lint.extend-select = [ "I" ]
lint.fixable = [ "ALL" ]

[tool.pyproject-fmt]
column_width = 120
indent = 2
keep_full_version = false
max_supported_python = "3.14"

[tool.ty]
src = { include = [ "src/pysanity" ] }

[tool.pytest]
testpaths = [ "src/pysanity/tests" ]
